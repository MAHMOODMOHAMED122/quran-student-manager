<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕌 Quran School Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-btn {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
        }

        .content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #667eea;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .progress-bar {
            background: #e0e0e0;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.3s;
        }

        .profile-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .profile-card h2 {
            font-size: 1.8em;
            margin-bottom: 15px;
        }

        .profile-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .profile-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid white;
        }

        .profile-item-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .profile-item-value {
            font-size: 1.4em;
            font-weight: 600;
        }

        .notes-section {
            margin-top: 30px;
        }

        .notes-section h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .note-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
        }

        .note-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .note-date {
            color: #999;
            font-size: 0.9em;
            margin-top: 8px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .two-column {
                grid-template-columns: 1fr;
            }

            .nav-tabs {
                flex-direction: column;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .profile-info {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            flex: 1;
            min-width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🕌 Quran School Manager</h1>
            <p>Professional Student Management System</p>
        </div>

        <div class="nav-tabs">
            <button class="nav-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
            <button class="nav-btn" onclick="switchTab('add-student')">➕ Add Student</button>
            <button class="nav-btn" onclick="switchTab('attendance')">📅 Attendance</button>
            <button class="nav-btn" onclick="switchTab('progress')">📈 Progress</button>
            <button class="nav-btn" onclick="switchTab('roles')">🎯 Roles</button>
            <button class="nav-btn" onclick="switchTab('notes')">📝 Notes</button>
            <button class="nav-btn" onclick="switchTab('profile')">👤 Profile</button>
            <button class="nav-btn" onclick="switchTab('remove')">🗑️ Remove</button>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" class="content active">
            <h2>📊 Dashboard Summary</h2>
            <div id="stats-container" class="stats-grid"></div>
            <table id="summary-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Current</th>
                        <th>Total</th>
                        <th>Remaining</th>
                        <th>Progress</th>
                        <th>Attendance</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody id="summary-tbody"></tbody>
            </table>
        </div>

        <!-- Add Student -->
        <div id="add-student" class="content">
            <h2>➕ Add New Student</h2>
            <div id="add-message"></div>
            <div class="form-group">
                <label>Student Name *</label>
                <input type="text" id="add-name" placeholder="Enter student name">
            </div>
            <div class="form-group">
                <label>Total Parts (default: 30)</label>
                <input type="number" id="add-parts" value="30" min="1">
            </div>
            <button class="btn btn-primary" onclick="addStudent()">Add Student</button>
        </div>

        <!-- Attendance -->
        <div id="attendance" class="content">
            <h2>📅 Mark Attendance</h2>
            <div id="attendance-message"></div>
            <div class="form-group">
                <label>Student Name *</label>
                <select id="attendance-name">
                    <option value="">Select a student...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Date (leave empty for today)</label>
                <input type="date" id="attendance-date">
            </div>
            <button class="btn btn-primary" onclick="markAttendance()">Mark Present</button>
        </div>

        <!-- Progress -->
        <div id="progress" class="content">
            <h2>📈 Update Progress</h2>
            <div id="progress-message"></div>
            <div class="form-group">
                <label>Student Name *</label>
                <select id="progress-name">
                    <option value="">Select a student...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Current Part Reached *</label>
                <input type="number" id="progress-part" min="0" max="30">
            </div>
            <button class="btn btn-primary" onclick="updateProgress()">Update Progress</button>
        </div>

        <!-- Roles -->
        <div id="roles" class="content">
            <h2>🎯 Assign Role</h2>
            <div id="roles-message"></div>
            <div class="form-group">
                <label>Student Name *</label>
                <select id="roles-name">
                    <option value="">Select a student...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Role *</label>
                <select id="roles-role">
                    <option value="">Select a role...</option>
                    <option value="Student">Student</option>
                    <option value="Junior Assistant">Junior Assistant</option>
                    <option value="Group Leader">Group Leader</option>
                    <option value="Prayer Monitor">Prayer Monitor</option>
                    <option value="Recitation Assistant">Recitation Assistant</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="assignRole()">Assign Role</button>
        </div>

        <!-- Notes -->
        <div id="notes" class="content">
            <h2>📝 Add Note</h2>
            <div id="notes-message"></div>
            <div class="form-group">
                <label>Student Name *</label>
                <select id="notes-name">
                    <option value="">Select a student...</option>
                </select>
            </div>
            <div class="form-group">
                <label>Note Type *</label>
                <select id="notes-type">
                    <option value="">Select note type...</option>
                    <option value="Strengths">Strengths</option>
                    <option value="Modification">Modification (Improvement)</option>
                    <option value="General">General</option>
                    <option value="Attendance">Attendance</option>
                    <option value="Behavior">Behavior</option>
                </select>
            </div>
            <div class="form-group">
                <label>Note Content *</label>
                <textarea id="notes-content" rows="4" placeholder="Enter your observation..."></textarea>
            </div>
            <button class="btn btn-primary" onclick="addNote()">Add Note</button>
        </div>

        <!-- Profile -->
        <div id="profile" class="content">
            <h2>👤 View Profile</h2>
            <div class="form-group">
                <label>Student Name *</label>
                <select id="profile-name">
                    <option value="">Select a student...</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="loadProfile()">Load Profile</button>
            <div id="profile-container" style="margin-top: 30px;"></div>
        </div>

        <!-- Remove -->
        <div id="remove" class="content">
            <h2>🗑️ Remove Student</h2>
            <div id="remove-message"></div>
            <div class="form-group">
                <label>Student Name *</label>
                <select id="remove-name">
                    <option value="">Select a student...</option>
                </select>
            </div>
            <button class="btn btn-danger" onclick="removeStudent()" style="background: #ff6b6b;">Remove Student</button>
        </div>
    </div>

    <script>
        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            if (tabName === 'dashboard') {
                loadSummary();
            }
            
            loadStudentDropdowns();
        }

        // Load student dropdowns
        async function loadStudentDropdowns() {
            try {
                const response = await fetch('/api/students');
                const students = await response.json();
                
                const selects = ['attendance-name', 'progress-name', 'roles-name', 'notes-name', 'profile-name', 'remove-name'];
                selects.forEach(selectId => {
                    const select = document.getElementById(selectId);
                    const currentValue = select.value;
                    select.innerHTML = '<option value="">Select a student...</option>';
                    students.forEach(student => {
                        const option = document.createElement('option');
                        option.value = student;
                        option.textContent = student;
                        select.appendChild(option);
                    });
                    select.value = currentValue;
                });
            } catch (error) {
                console.error('Error loading students:', error);
            }
        }

        // Add message display
        function showMessage(elementId, message, isSuccess = true) {
            const element = document.getElementById(elementId);
            const isError = message.includes('❌');
            element.innerHTML = `<div class="message ${isError ? 'error' : 'success'}">${message}</div>`;
            setTimeout(() => {
                element.innerHTML = '';
            }, 5000);
        }

        // Add student
        async function addStudent() {
            const name = document.getElementById('add-name').value.trim();
            const totalParts = document.getElementById('add-parts').value;
            
            if (!name) {
                showMessage('add-message', '❌ Please enter a student name', false);
                return;
            }
            
            try {
                const response = await fetch('/api/add-student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, total_parts: totalParts })
                });
                const data = await response.json();
                showMessage('add-message', data.message, data.success);
                if (data.success) {
                    document.getElementById('add-name').value = '';
                    document.getElementById('add-parts').value = '30';
                    loadStudentDropdowns();
                }
            } catch (error) {
                showMessage('add-message', '❌ Error adding student', false);
            }
        }

        // Mark attendance
        async function markAttendance() {
            const name = document.getElementById('attendance-name').value.trim();
            const date = document.getElementById('attendance-date').value;
            
            if (!name) {
                showMessage('attendance-message', '❌ Please select a student', false);
                return;
            }
            
            try {
                const response = await fetch('/api/mark-attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, date: date || null })
                });
                const data = await response.json();
                showMessage('attendance-message', data.message, data.success);
                if (data.success) {
                    document.getElementById('attendance-date').value = '';
                }
            } catch (error) {
                showMessage('attendance-message', '❌ Error marking attendance', false);
            }
        }

        // Update progress
        async function updateProgress() {
            const name = document.getElementById('progress-name').value.trim();
            const newPart = document.getElementById('progress-part').value;
            
            if (!name || !newPart) {
                showMessage('progress-message', '❌ Please fill in all fields', false);
                return;
            }
            
            try {
                const response = await fetch('/api/update-progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, new_part: newPart })
                });
                const data = await response.json();
                showMessage('progress-message', data.message, data.success);
                if (data.success) {
                    document.getElementById('progress-part').value = '';
                    loadSummary();
                }
            } catch (error) {
                showMessage('progress-message', '❌ Error updating progress', false);
            }
        }

        // Assign role
        async function assignRole() {
            const name = document.getElementById('roles-name').value.trim();
            const role = document.getElementById('roles-role').value;
            
            if (!name || !role) {
                showMessage('roles-message', '❌ Please select student and role', false);
                return;
            }
            
            try {
                const response = await fetch('/api/assign-role', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, role })
                });
                const data = await response.json();
                showMessage('roles-message', data.message, data.success);
                if (data.success) {
                    loadSummary();
                }
            } catch (error) {
                showMessage('roles-message', '❌ Error assigning role', false);
            }
        }

        // Add note
        async function addNote() {
            const name = document.getElementById('notes-name').value.trim();
            const noteType = document.getElementById('notes-type').value;
            const content = document.getElementById('notes-content').value.trim();
            
            if (!name || !noteType || !content) {
                showMessage('notes-message', '❌ Please fill in all fields', false);
                return;
            }
            
            try {
                const response = await fetch('/api/add-note', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, note_type: noteType, content })
                });
                const data = await response.json();
                showMessage('notes-message', data.message, data.success);
                if (data.success) {
                    document.getElementById('notes-content').value = '';
                    document.getElementById('notes-type').value = '';
                }
            } catch (error) {
                showMessage('notes-message', '❌ Error adding note', false);
            }
        }

        // Load profile
        async function loadProfile() {
            const name = document.getElementById('profile-name').value.trim();
            
            if (!name) {
                document.getElementById('profile-container').innerHTML = '';
                return;
            }
            
            try {
                const response = await fetch(`/api/profile/${name}`);
                if (!response.ok) throw new Error('Profile not found');
                
                const profile = await response.json();
                const progress = (profile.current_part / profile.total_parts) * 100;
                
                let html = `
                    <div class="profile-card">
                        <h2>${profile.name}</h2>
                        <div class="profile-info">
                            <div class="profile-item">
                                <div class="profile-item-label">Role</div>
                                <div class="profile-item-value">${profile.role}</div>
                            </div>
                            <div class="profile-item">
                                <div class="profile-item-label">Current / Total</div>
                                <div class="profile-item-value">${profile.current_part} / ${profile.total_parts}</div>
                            </div>
                            <div class="profile-item">
                                <div class="profile-item-label">Remaining Parts</div>
                                <div class="profile-item-value">${profile.remaining}</div>
                            </div>
                            <div class="profile-item">
                                <div class="profile-item-label">Progress</div>
                                <div class="profile-item-value">${profile.progress}%</div>
                            </div>
                            <div class="profile-item">
                                <div class="profile-item-label">Attendance Days</div>
                                <div class="profile-item-value">${profile.attendance_count}</div>
                            </div>
                            <div class="profile-item">
                                <div class="profile-item-label">Member Since</div>
                                <div class="profile-item-value">${profile.date_added}</div>
                            </div>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                    </div>
                    
                    <h3>📅 Recent Attendance</h3>
                    <ul style="margin-left: 20px;">
                `;
                
                if (profile.attendance.length > 0) {
                    profile.attendance.forEach(date => {
                        html += `<li>${date}</li>`;
                    });
                } else {
                    html += '<li>No attendance recorded</li>';
                }
                
                html += `</ul>`;
                
                if (profile.notes.length > 0) {
                    html += `<div class="notes-section">
                        <h3>📝 Recent Notes</h3>
                    `;
                    profile.notes.forEach(note => {
                        const date = note.date.substring(0, 10);
                        html += `
                            <div class="note-item">
                                <div class="note-type">${note.type}</div>
                                <div>${note.content}</div>
                                <div class="note-date">${date}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
                
                document.getElementById('profile-container').innerHTML = html;
            } catch (error) {
                document.getElementById('profile-container').innerHTML = '<p style="color: red;">Error loading profile</p>';
            }
        }

        // Load summary
        async function loadSummary() {
            try {
                const response = await fetch('/api/summary');
                const data = await response.json();
                
                // Load stats
                const stats = data.statistics;
                const statsHtml = `
                    <div class="stat-card">
                        <div class="stat-value">${stats.total_students}</div>
                        <div class="stat-label">Total Students</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.avg_progress}%</div>
                        <div class="stat-label">Average Progress</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.completed}</div>
                        <div class="stat-label">Completed</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value">${stats.junior_assistants}</div>
                        <div class="stat-label">Junior Assistants</div>
                    </div>
                `;
                document.getElementById('stats-container').innerHTML = statsHtml;
                
                // Load table
                const tbody = document.getElementById('summary-tbody');
                tbody.innerHTML = '';
                data.students.forEach(student => {
                    const progressPct = parseFloat(student.progress);
                    const progressColor = progressPct >= 90 ? '#4caf50' : progressPct >= 50 ? '#ff9800' : '#f44336';
                    
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${student.name}</strong></td>
                            <td>${student.current}</td>
                            <td>${student.total}</td>
                            <td>${student.remaining}</td>
                            <td>
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progressPct}%; background: ${progressColor};"></div>
                                </div>
                                ${student.progress}%
                            </td>
                            <td>${student.attendance}</td>
                            <td><strong>${student.role}</strong></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error loading summary:', error);
            }
        }

        // Remove student
        async function removeStudent() {
            const name = document.getElementById('remove-name').value.trim();
            
            if (!name) {
                showMessage('remove-message', '❌ Please select a student', false);
                return;
            }
            
            if (!confirm(`Are you sure you want to remove '${name}'? This cannot be undone.`)) {
                return;
            }
            
            try {
                const response = await fetch('/api/remove-student', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                const data = await response.json();
                showMessage('remove-message', data.message, data.success);
                if (data.success) {
                    loadStudentDropdowns();
                    loadSummary();
                }
            } catch (error) {
                showMessage('remove-message', '❌ Error removing student', false);
            }
        }

        // Initial load
        window.addEventListener('load', () => {
            loadStudentDropdowns();
            loadSummary();
        });
    </script>
</body>
</html>
